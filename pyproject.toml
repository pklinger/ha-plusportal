[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyplusportal"
version = "0.1.0"
description = "Async client for PlusPortal energy customer portals (Thüga SmartService white-label)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Philipp Klinger" }]
keywords = ["plusportal", "energy", "smart-meter", "germany", "home-assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/pklinger/ha-plusportal"
Issues = "https://github.com/pklinger/ha-plusportal/issues"

[project.scripts]
pyplusportal = "pyplusportal.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
]
ha = [
    "pytest-homeassistant-custom-component>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyplusportal"]

[tool.pytest.ini_options]
# The library suite. It must not load the Home Assistant pytest plugin: that
# plugin installs a global autouse fixture which collides with pytest-asyncio's
# auto mode and errors every async test here. The integration suite runs
# separately via pytest-ha.ini, which does load it.
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live' --strict-markers -p no:homeassistant"
markers = [
  "live: hits the real PlusPortal API; requires credentials, skipped by default",
]

[tool.coverage.run]
source = ["src/pyplusportal"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = [
  "E", "F", "W",    # pycodestyle, pyflakes
  "I",              # isort
  "N",              # pep8-naming
  "UP",             # pyupgrade
  "B",              # bugbear
  "A",              # builtins shadowing
  "C4",             # comprehensions
  "DTZ",            # naive datetimes
  "SIM",            # simplify
  "TID",            # tidy imports
  "PTH",            # pathlib
  "RUF",
  "D",              # pydocstyle
]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]
"tests_ha/*" = ["D100", "D101", "D102", "D103", "D104"]
"custom_components/*" = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
# The library targets 3.12, but Home Assistant's own sources use 3.13 syntax,
# so type checking runs on 3.13. `requires-python` still allows 3.12.
python_version = "3.13"
files = ["src", "tests", "custom_components"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["tests.*", "tests_ha.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

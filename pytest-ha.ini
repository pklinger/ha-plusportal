# Home Assistant integration suite.
#
# Kept separate from the library suite (configured in pyproject.toml) because
# pytest-homeassistant-custom-component installs a global autouse fixture that
# breaks pytest-asyncio's auto mode for plain async tests. Run with:
#
#     uv run --group ha pytest -c pytest-ha.ini
[pytest]
testpaths = tests_ha
# custom_components lives at the repo root, outside the src layout.
pythonpath = .
asyncio_mode = auto
addopts = --strict-markers

name: Claude review

# Reviews every pull request without needing a mention. Advisory: it comments,
# it does not gate. The gates are the CI checks in ci.yml.
on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A missing optional credential should not paint the pull request red.
      # `secrets` is not available in a job-level `if`, so the check happens
      # here and the review step keys off it.
      - id: credential
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN configured; skipping the review."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Advisory means advisory: this step must not be able to fail the pull
      # request. It already did once — the review finished its work and posted
      # nothing, because it took 21 turns against a cap of 20 and the action
      # treats that as an error. A red check nobody may act on trains everyone
      # to ignore red checks.
      - if: steps.credential.outputs.present == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request against the project's own standards, which
            are in CLAUDE.md and docs/specs/.

            Weight these, in order:

            1. Correctness against the specs. Does a changed behaviour still
               match the requirement it cites, and was the spec updated when the
               behaviour changed?
            2. Tests that cannot fail. This project has shipped three assertions
               that passed no matter what the implementation did. If a test looks
               like it might be vacuous, say which mutation would leave it green.
            3. The three portal traps in CLAUDE.md: interval timestamps mark the
               END, the fine series is power in kW, only period=month gives local
               midnight. Each is silent when wrong.
            4. Account data. Nothing identifying a real meter, customer or tenant
               may enter the repository.
            5. Decimal where money or a running sum is involved.

            Be specific and cite file:line. Do not restate the diff. If it is
            sound, say so briefly rather than inventing findings.
          claude_args: |
            --max-turns 30
            --model claude-opus-5

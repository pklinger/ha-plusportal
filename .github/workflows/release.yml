name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag matches the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --group ha

      # The packaging tests already pin pyproject, manifest.json and the
      # requirements pin to each other. This adds the tag to that chain, so a
      # release can never ship a version nobody agreed on.
      - name: Tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi
          echo "Releasing $version"

      - run: uv run pytest -q
      - run: uv run --group ha pytest -c pytest-ha.ini -q

  release:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyplusportal
    permissions:
      # Trusted Publishing: PyPI authenticates this workflow through GitHub's
      # OIDC provider, so there is no API token to store or rotate. Requires a
      # one-time setup on PyPI — see RELEASING.md.
      id-token: write
      # For creating the GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv build

      # Building and publishing in one job deliberately: passing dist/ between
      # jobs needs upload-artifact and download-artifact, and this workflow gets
      # exactly one chance to run correctly for a given tag. Two fewer actions
      # is two fewer ways for that one attempt to fail.
      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

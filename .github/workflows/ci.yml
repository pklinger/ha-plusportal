name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned exactly: setup-uv publishes floating major tags only up to v7.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --group ha
      - name: ruff
        run: uv run ruff check src tests tests_ha custom_components
      - name: ruff format
        run: uv run ruff format --check src tests tests_ha custom_components
      - name: mypy
        run: uv run --group ha mypy

  test-library:
    name: Library tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python }}
      # The `live` marker is excluded by default, so no credentials are needed
      # and CI never talks to a real customer portal.
      - run: uv run pytest -q --cov --cov-report=term --cov-fail-under=90

  test-integration:
    name: Home Assistant integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --group ha
      - run: uv run --group ha pytest -c pytest-ha.ini -q

  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  version:
    name: Version bump
    # Shipped code under an unchanged version means Home Assistant and HACS
    # keep serving the old one with nothing to indicate why.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv run python scripts/check_version_bump.py origin/${{ github.base_ref }}

  hacs:
    name: HACS validation
    # HACS fetches hacs.json and manifest.json without authentication, which
    # 404s on a private repository — the check reports them as invalid rather
    # than unreachable. It runs as soon as the repository is public; skipping
    # is honest, marking it continue-on-error would hide real failures later.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
